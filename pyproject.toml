[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-tg-bridge"
version = "0.2.0"
description = "Universal Telegram gateway for subscription AI CLI agents (Antigravity, Codex) and APIs"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
